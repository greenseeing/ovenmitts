[package]
name = "ovenmitts"
version = "0.1.0"
edition = "2021"
description = "Archival burning of large files (VeraCrypt containers) to BD-R / M-DISC with parity and cache-proof verification."
license = "MIT"
repository = "https://codeberg.org/greenseer/ovenmitts"
readme = "README.md"
rust-version = "1.80"

[[bin]]
name = "ovenmitts"
path = "src/main.rs"

[lib]
name = "ovenmitts"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
