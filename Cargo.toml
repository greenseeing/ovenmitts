[package]
name = "ovenmitts"
version = "0.1.8"
edition = "2021"
description = "Archival burning of large files (VeraCrypt containers) to BD-R / M-DISC with parity and cache-proof verification."
license = "MIT"
repository = "https://github.com/greenseeing/ovenmitts"
readme = "README.md"
rust-version = "1.80"

[[bin]]
name = "ovenmitts"
path = "src/main.rs"

[lib]
name = "ovenmitts"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
libc = "0.2"
signal-hook = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

# the span integration tests hash ~100 MiB payloads; debug-build sha2 turns
# that into minutes
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
