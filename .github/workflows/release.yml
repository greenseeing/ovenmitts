# On a v* tag: cross-compile static musl amd64+arm64 binaries and publish them
# (with SHA-256 sums, build-provenance attestations, and install.sh) to a
# GitHub release. No one-time setup: the workflow's own token writes releases
# and attestations via the job-scoped `permissions` below.
#
# Image tags on cargo-zigbuild are the tool version, not the Rust version —
# 0.23.0 ships Rust 1.93.0; older-looking tags can carry a Rust below this
# crate's 1.80 MSRV. GitHub's runners are amd64-only; the arm64 binary is
# cross-compiled, exactly as it was on Codeberg's.
#
# Actions and the build container are pinned by digest so a moved tag cannot
# inject code into a release (cf. tj-actions/changed-files, CVE-2025-30066);
# dependabot.yml keeps the pins current.
name: release

on:
  push:
    tags: ["v*"]

# Read-only by default; the release job widens its own scope below.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # mint the OIDC token attest-build-provenance signs with
      attestations: write # record the provenance attestation
    container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae
    defaults:
      run:
        # Container jobs default to sh; the build step below is written for bash.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl --bin ovenmitts
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ovenmitts dist/ovenmitts-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/ovenmitts dist/ovenmitts-linux-arm64
          cp install.sh dist/install.sh
          # Per-file sidecars, not one combined sum file: install.sh fetches `<asset>.sha256`.
          cd dist && for f in ovenmitts-linux-amd64 ovenmitts-linux-arm64; do sha256sum "$f" > "$f.sha256"; done
      - name: attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/ovenmitts-linux-amd64, dist/ovenmitts-linux-arm64"
      - name: publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          # Explicit: a release left drafted serves nothing — /releases/latest
          # excludes drafts, so install.sh and the updater would 404.
          draft: false
