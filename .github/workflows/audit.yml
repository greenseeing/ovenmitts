# Weekly RustSec advisory scan. Scheduled rather than per-PR so a fresh
# advisory in a transitive dependency never blocks unrelated work; run it
# on demand with the "Run workflow" button when a release is imminent.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --locked
      - run: cargo audit
